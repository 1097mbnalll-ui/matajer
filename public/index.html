<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
<title>مكتب متاجر أحد</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="loginForm" class="card">
    <div class="logo">🏢</div>
    <h1>مكتب متاجر أحد</h1>
    <p class="muted">خاص بالمالك</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="كلمة السر" required>
    <button class="btn primary" type="submit">دخول</button>
    <p id="loginMsg" class="err" role="alert"></p>
  </form>
</div>

<div id="app" hidden>
  <div id="view" class="view"></div>
  <nav class="tabbar" aria-label="التبويبات">
    <button data-tab="office"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1M10 21v-4h4v4"/></svg><span>المكتب</span></button>
    <button data-tab="chats" class="on"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/></svg><span>المحادثات</span><i id="badgeChats" class="tbadge" hidden></i></button>
    <button data-tab="ok"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg><span>الموافقات</span><i id="badgeOk" class="tbadge warn" hidden></i></button>
    <button data-tab="set"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>الإعدادات</span></button>
  </nav>
</div>

<div id="chat" class="chat" hidden></div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet-body" role="dialog" aria-modal="true">
    <button class="x" data-close aria-label="إغلاق">✕</button>
    <div id="sheetContent"></div>
  </div>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="app.js" type="module"></script>
</body>
</html>
