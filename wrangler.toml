# إعداد خادم «مكتب متاجر أحد». ما فيه أي سر هنا: الأسرار تنحط في Cloudflare (Secrets)
name = "ohod-office"
main = "src/worker.js"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "ohod-office"
database_id = "3915d543-7407-4480-a8e7-a9a8bc9781bc"

# ربط داخلي بخادم المتجر (Cloudflare يمنع worker يكلم worker ثاني بنفس الحساب عن طريق workers.dev)
[[services]]
binding = "STORE"
service = "ohod-admin"

# المراقب كل ٥ دقايق
[triggers]
crons = ["*/5 * * * *"]

[vars]
OFFICE_URL = "https://ohod-office.1097mbnalll.workers.dev"
STORE_API = "https://ohod-admin.1097mbnalll.workers.dev"
STORE_ORIGIN = "https://1097mbnalll-ui.github.io"
STORE_DATA_URL = "https://1097mbnalll-ui.github.io/Super/data.json"
